<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)"/>
  <!-- Eye shape (outer) -->
  <ellipse cx="32" cy="32" rx="18" ry="11" fill="white" opacity="0.95"/>
  <!-- Iris -->
  <circle cx="32" cy="32" r="7" fill="#1e40af"/>
  <!-- Pupil -->
  <circle cx="32" cy="32" r="3.5" fill="white"/>
  <!-- Pupil center -->
  <circle cx="32" cy="32" r="2" fill="#0f172a"/>
  <!-- Light reflection -->
  <circle cx="34" cy="30" r="1.2" fill="white" opacity="0.9"/>
  <!-- Eyelashes top -->
  <line x1="32" y1="20" x2="32" y2="17" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="24" y1="22" x2="22" y2="19" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="40" y1="22" x2="42" y2="19" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
</svg>
